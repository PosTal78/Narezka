[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narezchik"
version = "0.1.0"
description = "Local desktop application for video recap preparation"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = []

[project.scripts]
narezchik = "narezchik.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
