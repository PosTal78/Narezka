[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narezchik"
version = "0.1.0"
description = "Local desktop application for video recap preparation"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.11,<7"]
video = [
    "faster-whisper>=1.1,<2",
    "scenedetect[opencv]>=0.6,<1",
]
matching = [
    "transformers>=4.45,<6",
    "torch>=2.4,<3",
    "sentence-transformers>=3.0,<4",
    "sentencepiece>=0.2,<1",
]

[project.scripts]
narezchik = "narezchik.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
